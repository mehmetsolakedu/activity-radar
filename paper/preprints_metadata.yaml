title: >-
  AiWingman: A Local Continuity Overlay for Codex Task Portfolios with
  Retrospective Specification-Conformance Testing of Its Policy Layer
abstract: >-
  Persistent coding-agent work can leave simultaneous input requests, completed
  results, blockers, and quiet unfinished tasks.
  AiWingman is an open-source macOS menu-bar companion that derives continuity
  cues from locally retained Codex task evidence. Its dashboard and optional
  Wingman review are separate; obsolete or abandoned labels require reversible
  user confirmation, not silence or age. This Technical Note describes the
  system but evaluates only its pure
  continuity-policy layer, excluding both readers, the interface, graph signals,
  token accounting, Codex compatibility, and remote-review quality. The
  evaluation was retrospective and same-project: the Swift policy predated the
  written specification and 155 expected-output fixtures. The post-implementation
  specification and fixtures were frozen before the archived run, were not
  preregistered, and may reflect implementation knowledge; repository chronology
  does not exclude earlier exploratory or unarchived runs. A separately
  implemented same-project Python oracle generated expected outputs from the
  written rules. The Swift runner matched 155/155 fixtures. For each fixture,
  evaluations 2-100 matched evaluation 1 (15,500 evaluations; 15,345 nontrivial
  comparisons). A post-freeze supplementary driver launched 100 fresh processes
  on one arm64 Mac; all returned the same corpus digest. Across 70 unconfirmed
  lifecycle fixtures, none produced a confirmed-obsolete or confirmed-abandoned
  state. Later exact-commit CI reproduced both the conformance result and digest
  on hosted arm64 and native x86_64 macOS runners. The findings establish exact
  agreement with the 155 frozen same-project specification-derived fixture
  outputs, not general specification correctness. They do not establish external
  validation, human benefit, superiority, exact token cost or waste, security
  isolation, broad determinism, macOS 13 runtime compatibility, or stable Codex
  compatibility.
