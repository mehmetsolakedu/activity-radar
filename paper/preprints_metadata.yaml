manuscript_type: Technical Note
title: >-
  AiWingman: Design and Specification-Based Evaluation of a Local Continuity
  Overlay for Codex Task Portfolios
abstract: >-
  Persistent coding-agent tasks can leave a user with simultaneous requests for
  input, completed results, blocked tasks, and quiet but unfinished work.
  AiWingman is an open-source macOS menu-bar companion that presents continuity
  cues from locally retained Codex task evidence. Its ordinary dashboard and
  optional Wingman review are separate data pipelines. This report evaluates
  only the pure continuity-policy layer using a written specification and 155
  synthetic fixtures frozen before execution. A same-project Python oracle
  generated expected outputs as a separate implementation at the language
  boundary from the Swift policy. The Swift runner matched all 155 fixtures and
  produced one canonical digest across 15,500 within-process evaluations. All
  100 fresh benchmark processes produced the same corpus digest on one arm64
  Mac. Five seeded content sentinels produced zero occurrences in serialized
  policy outputs, and 70 unconfirmed lifecycle fixtures produced zero
  confirmed-obsolete or confirmed-abandoned states. Two simplified technical
  baselines agreed with 40/75 and 59/75 triage decisions and violated 35 and 16
  frozen no-recommendation cases. These results establish only specification
  conformance within the frozen synthetic scope; they do not establish external
  validation, human benefit, comparative superiority, exact token cost or
  waste, security isolation, cross-architecture determinism, reader validity,
  or stable Codex compatibility.
