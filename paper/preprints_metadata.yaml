title: >-
  AiWingman: A Local Continuity Overlay for Codex Task Portfolios with
  Retrospective Specification-Conformance Testing of Its Policy Layer
abstract: >-
  Persistent coding-agent work can leave concurrent input requests, completed
  results, blockers, and quiet unfinished tasks.
  AiWingman is an open-source macOS menu-bar companion that derives continuity
  cues from locally retained Codex task evidence. The dashboard and optional
  Wingman review are separate. Obsolete or abandoned labels require reversible
  user confirmation; silence and age are insufficient. This article describes
  the system but evaluates only its pure continuity-policy layer. The evaluation
  excludes both readers, the interface, graph signals, token accounting, Codex
  compatibility, and remote-review quality. It was retrospective and same-project:
  the Swift policy predated the written specification and 155 expected-output
  fixtures. The post-implementation specification and fixtures were frozen before
  the archived run and were not preregistered. They may reflect implementation
  knowledge, and repository chronology does not exclude earlier exploratory or
  unarchived runs. A separately implemented same-project Python oracle generated
  the expected outputs from the written rules. The Swift runner matched 155/155
  fixtures. For each fixture, evaluations 2-100 matched evaluation 1 (15,500
  evaluations; 15,345 nontrivial comparisons). A post-freeze supplementary driver
  launched 100 fresh processes on one arm64 Mac. All processes returned the same
  corpus digest. Across 70 unconfirmed lifecycle fixtures, none produced a
  confirmed-obsolete or confirmed-abandoned state. Later exact-commit
  continuous-integration (CI) jobs reproduced both the conformance result and
  digest on hosted arm64 and native x86_64 macOS runners. The findings establish
  exact agreement with the 155 frozen, same-project, specification-derived fixture
  outputs. They do not establish general specification correctness, external
  validation, human benefit, superiority, exact token cost or waste, security
  isolation, broad determinism, macOS 13 runtime compatibility, or stable Codex
  compatibility.
