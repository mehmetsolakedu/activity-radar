title: >-
  AiWingman: Design, Implementation, and an Open Evaluation Protocol for a
  Local Work-Continuity Companion for Parallel Coding-Agent Tasks
abstract: >-
  Parallel coding-agent tasks can produce a fragmented work surface: requests
  for input, completed results, blocked work, and quiet but unfinished tasks may
  coexist across many windows. Timestamps alone do not establish whether a task
  is running, finished, abandoned, or worth resuming. This technical report
  presents AiWingman, an open-source macOS menu-bar companion that reads locally
  retained Codex task state through read-only adapters, derives bounded and
  explainable continuity signals, and returns the user to a selected task
  through a local deep link. The design separates observations from user
  decisions, treats silence as neutral, and abstains from ranking when evidence
  is incomplete or insufficient. A distinct optional Wingman flow can send a
  previewed and bounded packet to a separately installed Codex CLI only after
  one-shot consent; this remote path is not part of the offline dashboard and is
  not presented as an isolation guarantee. The public source release was
  subjected to regression and contract checks on arm64 and native x86_64 macOS
  runners. These checks establish only the enumerated engineering properties;
  they do not establish human benefit, scientific superiority, exact token
  waste, full privacy isolation, or cross-system compatibility. The report
  therefore contributes a working software artifact, an auditable claim
  boundary, and an open protocol for later conformance, robustness, privacy,
  determinism, and performance evaluation. Human efficacy remains untested.
