name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: macOS verification
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install release verification dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ripgrep

      - name: Show Swift toolchain
        run: swift --version

      - name: Run complete public release verification
        env:
          REQUIRE_STANDARD_TESTS: "1"
        run: ./scripts/public-release-check.sh

      - name: Run frozen continuity-policy benchmark
        shell: bash
        run: |
          report="$RUNNER_TEMP/continuity-benchmark-${RUNNER_ARCH}.json"
          swift run -c release AiWingmanResearchBenchmark \
            --corpus Research/fixtures/continuity-policy-corpus-v1.json \
            --output "$report"
          REPORT="$report" python3 - <<'PY'
          import json
          import os

          result = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          assert result["overallPassed"] is True
          assert result["conformance"]["passedFixtureCount"] == 155
          assert result["conformance"]["passed"] is True
          assert result["conformance"]["failures"] == []
          assert result["determinism"]["corpusOutputDigestSHA256"] == (
              "fd72e52b8098d2f62f6c6f7ccc6de7e744de7ed03722d08c7f983527601db8e6"
          )
          print(
              "Frozen policy PASS:",
              result["environment"]["architecture"],
              result["determinism"]["corpusOutputDigestSHA256"],
          )
          PY

      - name: Assert diagnostics are content-free
        shell: bash
        run: |
          diagnostic_home="$RUNNER_TEMP/activity-radar-diagnostic-home"
          diagnostic_state="$diagnostic_home/.codex/state_5.sqlite"
          diagnostic_rollout="$diagnostic_home/.codex/PRIVATE-PATH-SENTINEL.jsonl"
          mkdir -p "$diagnostic_home/.codex"
          printf '%s\n' \
            '{"timestamp":"2026-01-01T00:00:00Z","type":"event_msg","payload":{"type":"agent_message","phase":"final_answer","message":"PRIVATE-CHECKPOINT-SENTINEL"}}' \
            '{"timestamp":"2026-01-01T00:00:01Z","type":"response_item","payload":{"type":"function_call","name":"request_user_input","call_id":"PRIVATE-CALL-ID-SENTINEL"}}' \
            > "$diagnostic_rollout"
          sqlite3 "$diagnostic_state" <<SQL
          CREATE TABLE threads (
            id TEXT, title TEXT, preview TEXT, cwd TEXT, rollout_path TEXT,
            created_at INTEGER, updated_at INTEGER,
            created_at_ms INTEGER, updated_at_ms INTEGER,
            archived INTEGER, thread_source TEXT, recency_at_ms INTEGER
          );
          CREATE TABLE thread_spawn_edges (child_thread_id TEXT);
          INSERT INTO threads VALUES (
            'PRIVATE-RAW-ID-SENTINEL',
            'PRIVATE-TITLE-SENTINEL',
            'PRIVATE-PREVIEW-SENTINEL',
            '$diagnostic_home/PRIVATE-WORKSPACE-SENTINEL',
            '$diagnostic_rollout',
            1767225600, 1767225600, 1767225600000, 1767225600000,
            0, 'user', 1767225600000
          );
          SQL
          diagnostic_output="$(
            CFFIXED_USER_HOME="$diagnostic_home" swift run ActivityRadarDiagnostics
          )"
          DIAGNOSTIC_OUTPUT="$diagnostic_output" python3 - <<'PY'
          import json
          import os

          report = json.loads(os.environ["DIAGNOSTIC_OUTPUT"])
          expected_keys = {
              "schemaVersion", "generatedAt", "itemCount", "hasMore",
              "executionStateCounts", "attentionReasonCounts",
              "goalStatusCounts", "completeHistoryCount",
              "partialHistoryCount", "privacy",
          }
          assert set(report) == expected_keys, "diagnostic top-level schema changed"
          assert report["itemCount"] == 1, "synthetic diagnostic fixture was not read"
          assert report["attentionReasonCounts"] == {"explicitInput": 1}, (
              "synthetic pending-input event was not reduced"
          )
          assert report["completeHistoryCount"] == 1, (
              "synthetic checkpoint rollout was not read completely"
          )
          assert report["partialHistoryCount"] == 0, (
              "synthetic checkpoint rollout was treated as partial"
          )
          assert report["privacy"] == {
              "includesTaskIdentifiers": False,
              "includesTitlesOrMessages": False,
              "includesFilePaths": False,
              "includesCheckpoints": False,
          }, "diagnostic privacy boundary changed"
          assert "PRIVATE-" not in os.environ["DIAGNOSTIC_OUTPUT"], (
              "diagnostic output exposed synthetic private content"
          )
          PY

  intel-runtime:
    name: Intel runtime
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require native Intel runner
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          swift --version

      - name: Run deterministic core self-test natively
        run: swift run ActivityRadarSelfTest

      - name: Require and run standard Swift tests natively
        shell: bash
        run: |
          test_list="$(swift test list)"
          if ! grep -Fq 'turnLifecycleAndFinalAnswer' <<< "$test_list"; then
            echo "The Intel runner did not discover the known standard tests."
            exit 1
          fi
          swift test

      - name: Run frozen continuity-policy benchmark natively
        shell: bash
        run: |
          report="$RUNNER_TEMP/continuity-benchmark-${RUNNER_ARCH}.json"
          swift run -c release AiWingmanResearchBenchmark \
            --corpus Research/fixtures/continuity-policy-corpus-v1.json \
            --output "$report"
          REPORT="$report" python3 - <<'PY'
          import json
          import os

          result = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          assert result["overallPassed"] is True
          assert result["conformance"]["passedFixtureCount"] == 155
          assert result["conformance"]["passed"] is True
          assert result["conformance"]["failures"] == []
          assert result["determinism"]["corpusOutputDigestSHA256"] == (
              "fd72e52b8098d2f62f6c6f7ccc6de7e744de7ed03722d08c7f983527601db8e6"
          )
          print(
              "Frozen policy PASS:",
              result["environment"]["architecture"],
              result["determinism"]["corpusOutputDigestSHA256"],
          )
          PY

      - name: Build application natively
        run: swift build -c release --product ActivityRadar
